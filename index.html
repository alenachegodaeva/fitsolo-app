<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1419">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitSolo">
  <title>FitSolo — твой ИИ-тренер</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🏋️ FitSolo</h1>
      <button id="theme-toggle" title="Сменить тему">🌙</button>
    </div>
    <p>Персональные тренировки с ИИ-тренером</p>
  </header>

  <section id="onboarding" class="screen active">
    <h2>Расскажи о себе</h2>
    <form id="profile-form">
      <input name="name" placeholder="Имя" required>
      <select name="gender" required>
        <option value="">Пол</option>
        <option value="male">Мужской</option>
        <option value="female">Женский</option>
      </select>
      <div class="row">
        <input name="age" type="number" placeholder="Возраст" required>
        <input name="weight" type="number" step="0.1" placeholder="Вес (кг)" required>
        <input name="height" type="number" placeholder="Рост (см)" required>
      </div>

      <select name="experience" required>
        <option value="">Опыт тренировок</option>
        <option value="beginner">Новичок (&lt; 6 мес)</option>
        <option value="intermediate">Средний (6 мес – 2 года)</option>
        <option value="advanced">Продвинутый (&gt; 2 лет)</option>
      </select>

      <select name="goal" required>
        <option value="">Цель</option>
        <option value="weight_loss">Похудение</option>
        <option value="muscle_gain">Набор массы</option>
        <option value="strength">Сила</option>
        <option value="endurance">Выносливость</option>
      </select>

      <input name="days_per_week" type="number" min="2" max="6" placeholder="Тренировок в неделю" required>

      <fieldset>
        <legend>Доступное оборудование</legend>
        <div class="checkbox-grid">
          <label><input type="checkbox" value="barbell" checked> Штанга</label>
          <label><input type="checkbox" value="kettlebell"> Гиря</label>
          <label><input type="checkbox" value="dumbbells" checked> Гантели</label>
          <label><input type="checkbox" value="machines" checked> Тренажёры</label>
          <label><input type="checkbox" value="bench"> Скамья</label>
          <label><input type="checkbox" value="bodyweight" checked> Свой вес</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Травмы / ограничения</legend>
        <div class="checkbox-grid">
          <label><input type="checkbox" value="lower_back"> Поясница</label>
          <label><input type="checkbox" value="knees"> Колени</label>
          <label><input type="checkbox" value="shoulder"> Плечи</label>
        </div>
      </fieldset>

      <button type="submit">Создать программу 🚀</button>
    </form>
  </section>

  <section id="main" class="screen">
   <div class="profile-bar">
  <span id="profile-name">👤 Загрузка...</span>
  <button id="edit-profile" class="btn-secondary">⚙️ Изменить профиль</button>
</div>
    <div class="tabs">
      <button data-tab="plan" class="tab active">📋 План</button>
      <button data-tab="chat" class="tab">🤖 Тренер</button>
      <button data-tab="log" class="tab">📝 Дневник</button>
      <button data-tab="stats" class="tab">📊 Прогресс</button>
      <button data-tab="nutrition" class="tab">🍎 Питание</button>
    </div>

    <div id="tab-plan" class="tab-content active">
      <div class="actions">
        <button id="export-btn" class="btn-secondary">📄 Скачать программу (PDF)</button>
        <button id="regen-btn" class="btn-secondary">🔄 Пересоздать</button>
      </div>
      <div id="plan-content"></div>
    </div>

    <div id="tab-chat" class="tab-content">
        <div class="chat-header" style="display:flex; justify-content:flex-end; margin-bottom:8px;">
    <button id="clear-chat" class="btn-secondary" style="font-size:13px; padding:6px 12px;">🗑 Очистить историю</button>
  </div>
      <div id="chat-messages"></div>
      <div class="chat-input">
        <input id="chat-text" placeholder="Спроси тренера...">
        <button id="chat-send">➤</button>
      </div>
      <div class="quick-questions">
        <button class="quick-q">Как правильно приседать?</button>
        <button class="quick-q">Что мне есть после тренировки?</button>
        <button class="quick-q">Можно ли мне делать становую?</button>
      </div>
    </div>

    <div id="tab-log" class="tab-content">
      <h3>Добавить запись</h3>
      <form id="log-form">
        <input name="exercise" placeholder="Упражнение" required>
        <div class="row">
          <input name="weight" type="number" step="0.5" placeholder="Вес (кг)" required>
          <input name="reps" type="number" placeholder="Повторы" required>
          <input name="sets" type="number" placeholder="Подходы" required>
        </div>
        <button type="submit">Сохранить</button>
      </form>
      <h3 class="log-title">История</h3>
      <div id="logs-list"></div>
    </div>

    <div id="tab-stats" class="tab-content">
      <div id="stats-content">
        <p class="hint">Добавь записи в дневник, чтобы увидеть статистику 📈</p>
      </div>
    </div>
        <div id="tab-nutrition" class="tab-content">
      <h2>🍎 Норма КБЖУ</h2>
      <div id="nutrition-norm"></div>

      <h3>Добавить приём пищи</h3>
      <form id="meal-form">
        <input name="name" placeholder="Что съел?" required>
        <div class="row">
          <input name="grams" type="number" step="1" placeholder="Граммы" required>
          <input name="calories" type="number" step="1" placeholder="Ккал" required>
        </div>
        <div class="row">
          <input name="protein" type="number" step="0.1" placeholder="Белки, г" required>
          <input name="fat" type="number" step="0.1" placeholder="Жиры, г" required>
        </div>
        <input name="carbs" type="number" step="0.1" placeholder="Углеводы, г" required>
        <button type="submit">Добавить</button>
      </form>

      <h3 class="log-title">Съедено сегодня</h3>
      <div id="meals-list"></div>
    </div>
  </section>

  <script src="app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker зарегистрирован:', reg))
          .catch(err => console.log('Ошибка регистрации SW:', err));
      });
    }
  </script>
</body>
</html>
